<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-Index Example</title>
  <style>
    .container {
      position: relative;
      width: 400px;
      height: 300px;
      margin: auto;
      border: 2px solid #333;
    }

    .box {
      position: relative;
      width: 200px;
      height: 150px;
      color: white;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 8px;
    }

    .box1 {
      background: crimson;
      top: 30px;
      left: 30px;
      z-index: 1; /* ورا الكل */
    }

    .box2 {
      background: teal;
      top: 60px;
      left: 60px;
      z-index: 3; /* قدام */
    }

    .box3 {
      background: orange;
      top: 90px;
      left: 90px;
      z-index: 2; /* بالنص */
    }

    .note {
      margin-top: 20px;
      text-align: center;
      font-size: 16px;
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
    <div class="box box3">Box 3</div>
  </div>

    <div class="note">
        <p>Boxes are positioned using z-index. Box 2 is on top, Box 3 in the middle, and Box 1 at the bottom.</p>
    </div>

</body>
</html>
